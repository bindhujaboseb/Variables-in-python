<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Python Variables Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2F5F8F; --blue2:#3D7AB8; --sky:#EAF2FB; --yellow:#FFD43B; --ink:#1D2633; --muted:#66707F;
    --line:#E2E6EC; --bg:#F6F8FB; --card:#FFFFFF; --green:#3E8E41; --greenbg:#E8F4E8; --red:#C0392B; --redbg:#FBEAE8;
    --amber:#B7791F; --amberbg:#FFF6E0; --code:#1E2A38; --codeink:#E6EDF3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:17px;line-height:1.5}
  button{font-family:inherit}
  .top{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line)}
  .top img{width:46px;height:auto}
  .top .sch{font-weight:800;font-size:16px;line-height:1.2}
  .top .sch small{display:block;font-weight:600;color:var(--muted);font-size:13px}
  .top .sp{flex:1}
  .chip{background:var(--sky);color:var(--blue);font-weight:700;border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
  .pts{background:var(--yellow);color:#4A3B00}
  .out{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:14px}
  .steps{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:12px 16px 0}
  .steps span{font-size:13px;font-weight:700;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px}
  .steps span.done{background:var(--greenbg);color:var(--green);border-color:#CDE6CD}
  .steps span.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  main{max-width:860px;margin:0 auto;padding:18px 16px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 26px;margin-top:14px;box-shadow:0 2px 10px rgba(29,38,51,.04)}
  h1{font-size:28px;margin:0 0 6px;line-height:1.2}
  h2{font-size:22px;margin:0 0 6px}
  .tag{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue2);margin-bottom:6px}
  .lo{background:var(--sky);border-left:5px solid var(--blue2);border-radius:10px;padding:12px 16px;margin:14px 0;font-size:16px}
  .muted{color:var(--muted)}
  label{display:block;font-weight:700;margin:14px 0 6px;font-size:15px}
  input,select,textarea{width:100%;font:inherit;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue2)}
  textarea{min-height:110px;resize:vertical}
  textarea.code{font-family:'JetBrains Mono',monospace;font-size:14px;background:#FBFCFE}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btn{display:inline-block;border:none;background:var(--blue);color:#fff;font-weight:800;font-size:17px;padding:12px 24px;border-radius:12px;cursor:pointer;margin-top:18px}
  .btn:hover{background:var(--blue2)}
  .btn:disabled{background:#AEB7C4;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
  .btn.yellow{background:var(--yellow);color:#3A2F00}
  .linkbtn{background:none;border:none;color:var(--blue2);font-weight:700;cursor:pointer;text-decoration:underline;font-size:15px;padding:0;margin-top:14px}
  .err{color:var(--red);font-weight:700;margin-top:10px;min-height:1px}
  .opts{display:grid;gap:10px;margin-top:14px}
  .opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:13px 16px;font-size:17px;cursor:pointer;color:var(--ink)}
  .opt:hover{border-color:var(--blue2);background:var(--sky)}
  .opt .k{flex:none;width:32px;height:32px;border-radius:50%;background:var(--sky);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800}
  .opt.ok{border-color:var(--green);background:var(--greenbg)}
  .opt.ok .k{background:var(--green);color:#fff}
  .opt.no{border-color:var(--red);background:var(--redbg)}
  .opt.no .k{background:var(--red);color:#fff}
  .opt:disabled{cursor:default}
  .fb{margin-top:12px;font-weight:700;padding:10px 14px;border-radius:10px}
  .fb.ok{background:var(--greenbg);color:var(--green)}
  .fb.no{background:var(--redbg);color:var(--red)}
  .qnum{font-size:14px;color:var(--muted);font-weight:700}
  .video{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#000;margin-top:14px}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  pre{background:var(--code);color:var(--codeink);font-family:'JetBrains Mono',monospace;font-size:15px;border-radius:12px;padding:14px 16px;overflow:auto;margin:10px 0;line-height:1.6}
  .levels{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
  .lv{font-family:inherit;font-size:13px;font-weight:800;padding:5px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted);cursor:pointer}
  .lv:disabled{cursor:default;opacity:.55}
  .lv[data-lv]:hover{border-color:var(--blue2)}
  .lv.done{background:var(--greenbg);color:var(--green);border-color:#CDE6CD}
  .lv.on{background:var(--yellow);color:#3A2F00;border-color:#E9C12E}
  .hint code{background:#fff;border-radius:5px;padding:1px 6px;font-size:14px}
  .hint{background:var(--amberbg);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:15px;color:#6B4A0E}
  .steps-idle{margin:10px 0 0;padding-left:20px;font-size:15px;color:var(--muted)}
  .center{text-align:center}
  .big{font-size:54px;line-height:1}
  .spinner{width:44px;height:44px;border:5px solid var(--sky);border-top-color:var(--blue2);border-radius:50%;animation:spin 1s linear infinite;margin:14px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
  .summary div{background:var(--sky);border-radius:12px;padding:12px;text-align:center}
  .summary b{display:block;font-size:24px;color:var(--blue)}
  .summary span{font-size:13px;color:var(--muted);font-weight:700}
  .sync{position:fixed;right:14px;bottom:12px;font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
  .btn.sm{font-size:15px;padding:9px 16px;margin-top:0;white-space:nowrap}
  .sim{display:grid;grid-template-columns:1.05fr 1fr;gap:14px;margin-top:14px}
  .simL{display:grid;gap:10px;align-content:start}
  .ed{background:var(--code);border-radius:14px;overflow:hidden}
  .edh{font-size:13px;font-weight:700;color:#9FB0C3;padding:8px 12px;background:#16202B;display:flex;align-items:center;gap:6px}
  .edh i{width:10px;height:10px;border-radius:50%;background:#FF6B5F;display:inline-block}.edh i+i{background:#FFC542}.edh i+i+i{background:#3FC56A}
  .edh.light{background:#EEF2F7;color:var(--muted)}
  .edc{min-height:170px;max-height:220px;overflow:auto;padding:10px 0;font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--codeink)}
  .eln{display:flex;gap:12px;padding:2px 12px}.eln b{color:#5C6E82;font-weight:400;width:18px;text-align:right;flex:none}
  .eln.cur{background:rgba(255,212,59,.13)}.eln.bad{background:rgba(255,99,90,.2)}
  .eln em{font-style:normal}.eln em.s{color:#A5E075}.eln em.f{color:#FFC66D}.eln em.n{color:#7FC8FF}
  .shell{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .shc{min-height:80px;max-height:120px;overflow:auto;padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:15px;color:#1F4FA0}
  .shl{animation:fadeIn .4s}.shl.err{color:#C0392B}.shl.note{color:var(--muted);font-style:italic;font-size:13px}
  .simR{background:linear-gradient(#FBF7EE,#F5EEDD);border:1px solid #EADFC6;border-radius:14px;padding:12px;display:flex;flex-direction:column}
  .memh{font-weight:800;color:#7A5B1E;font-size:15px}
  .shelf{flex:1;display:flex;flex-wrap:wrap;gap:14px;align-content:flex-start;padding:14px 4px 12px;min-height:210px;border-bottom:8px solid #C89B5A;border-radius:0 0 4px 4px}
  .empty{color:#B59B6A;font-style:italic;margin:auto}
  .vbox{width:128px;border-radius:12px;border:2px solid;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.08);overflow:hidden;position:relative}
  .vlab{font-weight:800;font-size:15px;padding:5px 8px;text-align:center;font-family:'JetBrains Mono',monospace;color:#fff}
  .vval{height:46px;position:relative;overflow:hidden;font-family:'JetBrains Mono',monospace;font-weight:600;font-size:17px}
  .vval span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vtype{font-size:11px;font-weight:700;text-align:center;padding:3px 4px;opacity:.8}
  .t-str{border-color:#E0B100}.t-str .vlab{background:#E0A800}.t-str .vtype{background:#FFF6D1;color:#7A5C00}
  .t-int{border-color:#2F6DB5}.t-int .vlab{background:#2F6DB5}.t-int .vtype{background:#E3EEFB;color:#1E4E86}
  .t-float{border-color:#2E8B57}.t-float .vlab{background:#2E8B57}.t-float .vtype{background:#E2F4EA;color:#1D6440}
  .vbox.drop{animation:drop .6s cubic-bezier(.3,1.5,.6,1)}
  .vbox.read{animation:glow .8s}
  .vbox.changed{animation:wiggle .5s}
  .vval .in{animation:dropIn .55s ease-out}
  .vval .out{animation:flyOut .8s forwards;color:#C0392B;text-decoration:line-through}
  @keyframes drop{from{transform:translateY(-60px) scale(.6);opacity:0}to{transform:none;opacity:1}}
  @keyframes dropIn{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
  @keyframes flyOut{to{transform:translateY(-34px) rotate(-12deg);opacity:0}}
  @keyframes glow{0%,100%{box-shadow:0 4px 0 rgba(0,0,0,.08)}40%{box-shadow:0 0 0 6px rgba(255,212,59,.9)}}
  @keyframes wiggle{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
  @keyframes fadeIn{from{opacity:0}}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:700;color:#7A6A4A;margin-top:8px}
  .lg{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}.lg.str{background:#E0A800}.lg.int{background:#2F6DB5}.lg.float{background:#2E8B57}
  .cap{margin-top:14px;background:var(--sky);border-radius:12px;padding:14px 18px;font-size:18px;min-height:58px}
  .cap.pulse{animation:fadeIn .5s}
  .ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
  .dots{display:flex;gap:6px;margin-left:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.d{background:#9CC2E5}.dots i.on{background:var(--blue);transform:scale(1.25)}
  .tryrow{display:flex;gap:8px;align-items:center;margin-top:14px}
  .prompt{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--blue)}
  .cmd{font-family:'JetBrains Mono',monospace;font-size:16px}
  .missions{display:grid;gap:8px;margin-top:12px}
  .mis{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-size:16px}
  .mis span{flex:none;width:28px;height:28px;border-radius:50%;background:var(--sky);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800}
  .mis.ok{border-color:#CDE6CD;background:var(--greenbg)}.mis.ok span{background:var(--green);color:#fff}
  @media (max-width:760px){.sim{grid-template-columns:1fr}}
  pre.outp{background:#fff;color:#1F4FA0;border:1px dashed #9CC2E5}
  .certwrap{margin:16px auto 0;max-width:100%;border-radius:10px;box-shadow:0 10px 30px rgba(31,46,110,.25);overflow:hidden;animation:drop .8s cubic-bezier(.3,1.4,.6,1)}
  .certwrap svg{display:block;width:100%;height:auto}
  .cconf{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:60;pointer-events:none;animation:cfall linear forwards}
  @keyframes cfall{to{transform:translateY(105vh) rotate(720deg)}}
  .lobar{background:var(--blue);color:#fff;border-radius:14px;padding:12px 18px;font-size:16px;margin-top:4px}
  .scbar{background:#fff;border:1.5px dashed #9CC2E5;border-radius:14px;padding:12px 18px;margin-top:16px;font-size:15px}
  .scbar b{color:var(--blue)}.scbar ul{margin:6px 0 0;padding-left:20px}.scbar li{margin:2px 0}
  .scbar ul.sclist{list-style:none;padding:0}
  .sclist li{display:flex;gap:10px;align-items:center;margin:6px 0}
  .sclist li span{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #C3CBD6;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
  .sclist li.met{color:var(--green);font-weight:700}.sclist li.met span{background:var(--green);border-color:var(--green);color:#fff}
  .code-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-top:12px}
  .codeed{display:block;width:100%;min-height:190px;border:none;border-radius:0;background:var(--code);color:var(--codeink);font-family:'JetBrains Mono',monospace;font-size:16px;line-height:1.6;padding:12px 14px;resize:vertical;tab-size:4}
  .codeed:focus{outline:2px solid var(--yellow);outline-offset:-2px}
  .simR.mini .shelf{min-height:150px;padding:10px 2px}
  .simR.mini .vbox{width:auto;min-width:110px;max-width:100%}
  .simR.mini .vval{height:auto;min-height:46px}
  .simR.mini .vval span{position:static;white-space:normal;word-break:break-word;padding:10px 8px;text-align:center}
  #lvOut{min-height:60px;max-height:200px}
  .chart{position:relative;margin-top:8px}
  .chart svg{display:block;width:100%;height:auto}
  .ctip{position:absolute;pointer-events:none;background:#1D2633;color:#fff;font-size:13px;font-weight:700;padding:6px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s}
  .pbar{height:10px;background:#EEF1F5;border-radius:5px;overflow:hidden;min-width:90px}
  .pbar i{display:block;height:100%;background:var(--blue2);border-radius:5px}
  @media (max-width:760px){.code-grid{grid-template-columns:1fr}}
  .qbox{border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:14px;background:#fff}
  .qbox.locked{background:#F7F9FB;color:var(--muted)}
  .qbox.qdone{border-color:#CDE6CD;background:#FBFEFB}
  .qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .qn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--sky);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800}
  .qn.ok{background:var(--green);color:#fff}
  .qtext{font-size:18px;margin-top:8px}
  .qtext pre{font-size:15px}
  .qbox .opts{margin-top:10px}
  .qbox .opt code{font-size:16px}
  .steps span.exl{cursor:pointer;border-color:var(--blue2);text-decoration:underline}
  .extabs{display:flex;gap:6px;flex-wrap:wrap;background:var(--sky);border-radius:14px;padding:5px;margin:10px 0 4px}
  .extabs button{flex:1;min-width:150px;border:none;background:transparent;font-family:inherit;font-size:16px;font-weight:800;color:var(--muted);padding:10px 12px;border-radius:10px;cursor:pointer}
  .extabs button.on{background:#fff;color:var(--blue);box-shadow:0 1px 6px rgba(29,38,51,.12)}
  .guide{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
  .bot{flex:none;width:52px;height:52px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 3px 0 #E0B100}
  .bubble{position:relative;flex:1;background:var(--sky);border-radius:14px;padding:12px 16px;font-size:18px;min-height:52px}
  .bubble:before{content:'';position:absolute;left:-8px;top:18px;border:8px solid transparent;border-left:0;border-right-color:var(--sky)}
  .bubble.pulse{animation:fadeIn .5s}
  .scn{font-size:14px;font-weight:800;color:var(--muted);margin-left:6px}
  .flyer{position:absolute;z-index:50;pointer-events:none;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;padding:4px 10px;border-radius:8px;color:#fff;transform:translate(-50%,-50%);transition:transform .7s cubic-bezier(.5,0,.3,1);box-shadow:0 4px 12px rgba(0,0,0,.2);margin-left:0}
  .flyer.t-str{background:#E0A800}.flyer.t-int{background:#2F6DB5}.flyer.t-float{background:#2E8B57}
  .exgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .excard{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
  .excard pre{font-size:13px;margin:8px 0}
  .builder{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .bstep{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
  .bstep h4{margin:0 0 4px;font-size:17px}
  .bstep label{margin:10px 0 4px;font-size:14px}
  .seg{display:inline-flex;background:var(--sky);border-radius:10px;padding:3px;gap:3px}
  .seg button{border:none;background:transparent;font-family:inherit;font-weight:800;font-size:15px;padding:7px 14px;border-radius:8px;cursor:pointer;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.1)}
  .pv{margin-top:10px;font-size:14px;color:var(--muted)}.pv code{font-size:15px;background:var(--code);color:var(--codeink);padding:3px 8px;border-radius:6px}
  .bstep .btn{margin-top:10px}
  details.own{margin-top:12px}details.own summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:15px}
  .steps button{font-family:inherit;font-size:13px;font-weight:700;color:var(--blue);background:#fff;border:1.5px solid var(--blue2);border-radius:999px;padding:4px 12px;cursor:pointer}
  .steps button.done{background:var(--greenbg);color:var(--green);border-color:var(--green)}
  .steps button:hover{background:var(--sky)}
  .navtip{flex-basis:100%;text-align:center;font-size:12px;color:var(--muted)}
  @media (max-width:760px){.exgrid,.builder{grid-template-columns:1fr}}
  /* dashboard */
  .dash{max-width:1280px}
  .kpis{display:grid;grid-template-columns:1.3fr repeat(5,1fr);gap:12px;margin-top:14px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .kpi .lab{font-size:14px;color:var(--muted);font-weight:700}
  .kpi .val{font-size:38px;font-weight:800;line-height:1.1}
  .kpi .val small{font-size:18px;color:var(--muted)}
  .kpi.main{background:var(--blue);color:#fff;border-color:var(--blue)}
  .kpi.main .lab,.kpi.main .val small{color:#D6E4F3}
  .tabs{display:inline-flex;background:var(--sky);border-radius:14px;padding:5px;gap:4px;flex-wrap:wrap}
  .tabs button{border:none;background:transparent;font-size:16px;font-weight:800;color:var(--muted);padding:9px 20px;border-radius:10px;cursor:pointer}
  .tabs button.on{background:#fff;color:var(--blue);box-shadow:0 1px 6px rgba(29,38,51,.12)}
  .qgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .qcard{border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:12px;background:#fff}
  .qcard h4{margin:0 0 6px;font-size:18px;line-height:1.3}
  .bar{display:grid;grid-template-columns:30px 1fr 96px;gap:12px;align-items:center;margin:10px 0}
  .bar .k{width:30px;height:30px;border-radius:50%;background:var(--sky);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--muted);font-size:14px}
  .bar.ok .k{background:var(--green);color:#fff}
  .bar .txt{font-size:15px;margin-bottom:4px}
  .bar.ok .txt{font-weight:800}
  .bar .trk{height:22px;background:#EEF1F5;border-radius:8px;overflow:hidden}
  .bar .fill{height:100%;background:#BFC7D2;border-radius:8px;transition:width .4s}
  .bar.ok .fill{background:var(--green)}
  .bar.lvl .fill{background:var(--blue2)}
  .bar .n{font-size:20px;font-weight:800;text-align:right;line-height:1.1}
  .bar .n small{display:block;font-size:12px;color:var(--muted);font-weight:700}
  .hots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .hots div{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#FFFDF3}
  .hots b{display:block;font-size:14px;color:var(--blue)}
  table{width:100%;border-collapse:collapse;font-size:15px;margin-top:10px}
  th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .pill{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--sky);color:var(--blue)}
  .pill.wait{background:var(--amberbg);color:var(--amber)}
  .pill.done{background:var(--greenbg);color:var(--green)}
  .band{font-weight:800;font-size:13px}
  .band.wt{color:var(--red)} .band.at{color:var(--amber)} .band.ab{color:var(--green)}
  .tick{color:var(--green);font-weight:800} .dash0{color:#C3C9D2}
  .apgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
  .apcol{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
  .aphead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.aphead .muted{font-size:13px;flex:1}
  .aplist{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;min-height:34px}
  .apchip{display:inline-flex;align-items:center;gap:8px;background:var(--amberbg);color:#6B4A0E;font-weight:700;border-radius:999px;padding:4px 4px 4px 12px;font-size:14px}
  .apchip button{border:none;background:var(--green);color:#fff;font-weight:800;border-radius:50%;width:26px;height:26px;cursor:pointer}
  .sbtn:disabled{background:#AEB7C4;cursor:default}
  @media (max-width:760px){.apgrid{grid-template-columns:1fr}}
  .sbtn{border:none;background:var(--green);color:#fff;font-weight:800;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
  .bands{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
  .bands div{border-radius:14px;padding:14px;text-align:center}
  .bands b{display:block;font-size:34px;line-height:1.1}
  .bands .wt{background:var(--redbg);color:var(--red)} .bands .at{background:var(--amberbg);color:var(--amber)} .bands .ab{background:var(--greenbg);color:var(--green)}
  @media (max-width:760px){.row,.qgrid,.hots,.kpis,.summary,.bands{grid-template-columns:1fr 1fr}.card{padding:18px}h1{font-size:23px}}
  @media (max-width:480px){.row,.qgrid,.hots,.kpis,.summary,.bands{grid-template-columns:1fr}}
  @media print{.top .out,.steps,.sync,.noprint{display:none}}

  /* ================= COLOUR THEME ================= */
  :root{--acc:#3D7AB8;--acc2:#2F5F8F;--accbg:#EAF2FB}
  body[data-stage="login"],body[data-stage="starter"]{--acc:#7B5CD6;--acc2:#5B3FB0;--accbg:#F1ECFF}
  body[data-stage="wait"]{--acc:#E056A0;--acc2:#B83A80;--accbg:#FDEAF4}
  body[data-stage="video"]{--acc:#14A3A0;--acc2:#0E7C7A;--accbg:#E3F7F6}
  body[data-stage="main"]{--acc:#3D7AB8;--acc2:#2F5F8F;--accbg:#EAF2FB}
  body[data-stage="check"]{--acc:#F08C1A;--acc2:#C46A08;--accbg:#FFF2E2}
  body[data-stage="plenary"],body[data-stage="hot"]{--acc:#E04E6A;--acc2:#B33350;--accbg:#FDECEF}
  body[data-stage="done"]{--acc:#3E8E41;--acc2:#2C6E2F;--accbg:#E8F4E8}
  html,body{background:
    radial-gradient(circle at 8% 12%, rgba(123,92,214,.10) 0 180px, transparent 181px),
    radial-gradient(circle at 92% 30%, rgba(20,163,160,.10) 0 220px, transparent 221px),
    radial-gradient(circle at 15% 85%, rgba(255,159,28,.10) 0 200px, transparent 201px),
    radial-gradient(circle at 85% 90%, rgba(224,86,160,.09) 0 180px, transparent 181px),
    #F7F8FC;background-attachment:fixed}
  .top{border-bottom:none;box-shadow:0 2px 10px rgba(29,38,51,.06);position:relative}
  .top:after{content:'';position:absolute;left:0;right:0;bottom:-5px;height:5px;background:linear-gradient(90deg,#FF5A5F,#FF9F1C,#FFD43B,#3EC46D,#2EC4B6,#3D7AB8,#7B5CD6,#E056A0)}
  .chip{background:var(--accbg);color:var(--acc2)}
  .chip.pts{background:linear-gradient(135deg,#FFD43B,#FF9F1C);color:#4A2E00}
  .steps{padding-top:18px}
  .steps span,.steps button{transition:transform .15s}
  .steps span.on,.steps button.on{background:var(--acc);border-color:var(--acc);color:#fff;transform:scale(1.06)}
  .card{border:none;box-shadow:0 6px 24px rgba(29,38,51,.08);position:relative;overflow:hidden}
  main>#app>.card:first-child:before,#app>.card:before{content:'';position:absolute;left:0;top:0;right:0;height:6px;background:linear-gradient(90deg,var(--acc),#FFD43B)}
  .tag{color:var(--acc)}
  h1,h2{color:#1D2633}
  .btn{background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 3px 0 rgba(0,0,0,.12)}
  .btn:hover{background:linear-gradient(135deg,var(--acc2),var(--acc));filter:brightness(1.05)}
  .btn:active{transform:translateY(2px);box-shadow:none}
  .btn.ghost{background:#fff;color:var(--acc2);border:1.5px solid var(--acc);box-shadow:none}
  .btn.ghost:hover{background:var(--accbg)}
  .btn.yellow{background:linear-gradient(135deg,#FFD43B,#FF9F1C);color:#3A2600}
  .btn:disabled{background:#C4CBD6;box-shadow:none}
  .linkbtn{color:var(--acc2)}
  .lo{background:var(--accbg);border-left-color:var(--acc)}
  .lobar{background:linear-gradient(135deg,#7B5CD6,#3D7AB8 60%,#14A3A0);box-shadow:0 4px 14px rgba(61,122,184,.25)}
  .scbar{border:none;background:linear-gradient(135deg,#FFFBEA,#EFFAF1);box-shadow:0 4px 14px rgba(29,38,51,.06)}
  .opt{border-width:2px}
  .opt:hover{border-color:var(--acc);background:var(--accbg)}
  .opt[data-j="0"] .k,.opt[data-m="0"] .k{background:#FFE3E4;color:#D93A40}
  .opt[data-j="1"] .k,.opt[data-m="1"] .k{background:#FFF0D9;color:#C46A08}
  .opt[data-j="2"] .k,.opt[data-m="2"] .k{background:#DDF6F4;color:#0E7C7A}
  .opt.ok .k{background:var(--green)!important;color:#fff!important}
  .opt.no .k{background:var(--red)!important;color:#fff!important}
  .qnum{color:var(--acc)}
  .levels .lv:nth-child(1){--lc:#7B5CD6}.levels .lv:nth-child(2){--lc:#14A3A0}.levels .lv:nth-child(3){--lc:#F08C1A}.levels .lv:nth-child(4){--lc:#E056A0}
  .lv{border:2px solid var(--lc);color:var(--lc);background:#fff}
  .lv.on{background:var(--lc);color:#fff;border-color:var(--lc)}
  .lv.done{background:var(--greenbg);color:var(--green);border-color:#9BD49D}
  .qbox{border:2px solid #E6EAF2}
  .qbox:nth-of-type(3n+1) .qn{background:#F1ECFF;color:#5B3FB0}
  .qbox:nth-of-type(3n+2) .qn{background:#E3F7F6;color:#0E7C7A}
  .qbox:nth-of-type(3n) .qn{background:#FFF2E2;color:#C46A08}
  .qn.ok{background:var(--green)!important;color:#fff!important}
  .qbox.qdone{border-color:#BFE3C0;background:#FAFFFA}
  .hint{background:linear-gradient(135deg,#FFF6D6,#FFEFD9);border-left:5px solid #FFB627}
  .fb.ok{background:linear-gradient(135deg,#E8F7E8,#DDF6F4)}
  .fb.no{background:linear-gradient(135deg,#FDECEC,#FFF0E3)}
  .extabs button:nth-child(1).on{color:#0E7C7A}.extabs button:nth-child(2).on{color:#5B3FB0}.extabs button:nth-child(3).on{color:#C46A08}
  .extabs{background:linear-gradient(90deg,#E3F7F6,#F1ECFF,#FFF2E2)}
  .bubble{background:linear-gradient(135deg,#E3F7F6,#EAF2FB)}.bubble:before{border-right-color:#E3F7F6}
  .bot{background:linear-gradient(135deg,#FFD43B,#FF9F1C)}
  .excard:nth-child(1){border-color:#C9BDF2;background:#FAF8FF}.excard:nth-child(2){border-color:#F6C68E;background:#FFFBF5}
  .excard:nth-child(3){border-color:#9FDCD9;background:#F5FDFC}.excard:nth-child(4){border-color:#F3B6D4;background:#FFF7FB}
  .bstep:nth-child(1){border-color:#9FDCD9;background:#F5FDFC}.bstep:nth-child(2){border-color:#C9BDF2;background:#FAF8FF}
  .mis{border-width:2px}
  .summary div:nth-child(1){background:#F1ECFF}.summary div:nth-child(1) b{color:#5B3FB0}
  .summary div:nth-child(2){background:#E3F7F6}.summary div:nth-child(2) b{color:#0E7C7A}
  .summary div:nth-child(3){background:#FDECEF}.summary div:nth-child(3) b{color:#B33350}
  .summary div:nth-child(4){background:#FFF2CC}.summary div:nth-child(4) b{color:#9A6B00}
  .spinner{border-color:var(--accbg);border-top-color:var(--acc)}
  input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
  .sync{background:#fff;border-color:var(--accbg)}
  /* dashboard stays calm for the projector */
  body.teacher .card:before{display:none}
</style>
</head>

function runProgram(code) {
  const vm = makeVM(), P = { code, vars: vm.vars, prints: [], setReads: {}, out: [], err: null, fmt: vm.fmt };
  const lines = code.replace(/\t/g, '    ').split('\n');
  for (let n = 0; n < lines.length; n++) {
    const ln = lines[n], t = ln.trim();
    if (!t || t.startsWith('#')) continue;
    if (/^\s+\S/.test(ln)) { P.err = { line: n + 1, text: 'IndentationError: unexpected indent', help: 'Remove the spaces at the start of this line.' }; break; }
    const r = vm.run(t);
    if (r.kind === 'error') { P.err = { line: n + 1, text: r.text, help: r.help || (/^print/.test(t) && /SyntaxError/.test(r.text) ? 'Check the commas – every part inside print() must be separated by a comma.' : '') }; break; }
    if (r.kind === 'print') { P.prints.push({ text: r.text, reads: r.reads, src: t }); P.out.push(r.text); }
    if (r.kind === 'set') P.setReads[r.name] = r.reads;
  }
  return P;
}

function persist() {

async function pushRow() {
  const row = rowOf();
  if (!SHEET_URL) { const all = ls.get(STORE + '_rows') || {}; const o = all[row.key] || {}; all[row.key] = Object.assign(o, row, { approved: o.approved || row.approved, unlock: o.unlock || row.unlock }); ls.set(STORE + '_rows', all); return; }
  showSync('Saving…');

  } catch (e) { showSync('Offline – will retry'); setTimeout(pushRow, 5000); }

function showSync(t) { const el = $('sync'); el.hidden = false; el.textContent = t; }
const GAS = typeof google !== 'undefined' && google.script && google.script.run;
const gas = (fn, ...a) => new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a));
let ANIM_URL = '';
let pinFails = 0, pinLockUntil = 0;
async function checkPin(kind, pin) {
  if (Date.now() < pinLockUntil) return { ok: false, msg: 'Too many tries – wait 30 seconds.' };
  if (!pin) return { ok: false, msg: 'Please type the PIN.' };
  if (!SHEET_URL && !GAS) return { ok: true, preview: true };
  try {
    const r = GAS ? await gas('dashVerify', pin) : await getJSON({ action: 'verify', kind, pin });
    if (r && r.anim !== undefined) ANIM_URL = r.anim || '';
    if (r && r.ok) { pinFails = 0; return { ok: true }; }
    if (++pinFails >= 5) { pinFails = 0; pinLockUntil = Date.now() + 30000; }
    return { ok: false, msg: 'Wrong PIN.' };
  } catch (e) { return { ok: false, msg: 'Could not reach the Google Sheet – check the internet and try again.' }; }
}
async function getJSON(params) {
  const u = SHEET_URL + '?' + new URLSearchParams(params).toString() + '&t=' + Date.now();
  const r = await fetch(u); return r.json();
}

const KW = ['print', 'if', 'else', 'elif', 'for', 'while', 'and', 'or', 'not', 'True', 'False', 'None', 'def', 'class', 'import', 'in', 'is', 'return', 'input'];

function makeVM() {
  const vars = {};
  const fmt = (x, inPrint) => x.t === 'str' ? (inPrint ? x.v : `"${x.v}"`) : x.t === 'float' ? (Number.isInteger(x.v) ? x.v.toFixed(1) : String(+x.v.toFixed(6))) : String(x.v);
  function tokens(src) {
    const re = /\s*("([^"]*)"|'([^']*)'|\d+\.\d+|\d+|[A-Za-z_]\w*|[+\-*/])/y, out = []; let m; re.lastIndex = 0;
    while (re.lastIndex < src.length) {
      if (/^\s*$/.test(src.slice(re.lastIndex))) break;
      m = re.exec(src); if (!m) throw ['SyntaxError', 'invalid syntax'];
      const t = m[1];
      if (t[0] === '"' || t[0] === "'") out.push({ k: 'v', x: { t: 'str', v: m[2] ?? m[3] } });
      else if (/^\d+\.\d+$/.test(t)) out.push({ k: 'v', x: { t: 'float', v: parseFloat(t) } });
      else if (/^\d+$/.test(t)) out.push({ k: 'v', x: { t: 'int', v: parseInt(t, 10) } });
      else if (/^[+\-*/]$/.test(t)) out.push({ k: 'op', o: t });
      else out.push({ k: 'n', n: t });
    }
    return out;
  }
  function evalExpr(src, reads) {
    const tk = tokens(src); if (!tk.length) throw ['SyntaxError', 'invalid syntax'];
    const vals = [], ops = [];
    tk.forEach((t, i) => {
      const wantVal = i % 2 === 0;
      if (wantVal && t.k === 'op') throw ['SyntaxError', 'invalid syntax'];
      if (!wantVal && t.k !== 'op') throw ['SyntaxError', 'invalid syntax'];
      if (t.k === 'op') return ops.push(t.o);
      if (t.k === 'v') return vals.push(t.x);
      if (!(t.n in vars)) throw ['NameError', `name '${t.n}' is not defined`];
      reads.add(t.n); vals.push(vars[t.n]);
    });
    if (vals.length !== ops.length + 1) throw ['SyntaxError', 'invalid syntax'];
    const ap = (a, o, b) => {
      if (a.t === 'str' || b.t === 'str') {
        if (o === '+' && a.t === 'str' && b.t === 'str') return { t: 'str', v: a.v + b.v };
        if (o === '*' && (a.t === 'str') !== (b.t === 'str') && (a.t === 'int' || b.t === 'int')) { const s = a.t === 'str' ? a : b, n = a.t === 'str' ? b : a; return { t: 'str', v: s.v.repeat(Math.max(0, n.v)) }; }
        if (o === '+') throw ['TypeError', a.t === 'str' ? `can only concatenate str (not "${b.t}") to str` : `unsupported operand type(s) for +: '${a.t}' and 'str'`];
        throw ['TypeError', `unsupported operand type(s) for ${o}: '${a.t}' and '${b.t}'`];
      }
      if (o === '/') { if (b.v === 0) throw ['ZeroDivisionError', 'division by zero']; return { t: 'float', v: a.v / b.v }; }
      const v = o === '+' ? a.v + b.v : o === '-' ? a.v - b.v : a.v * b.v;
      return { t: a.t === 'float' || b.t === 'float' ? 'float' : 'int', v };
    };
    // * and / first, then + and -
    let V = [vals[0]], O = [];
    ops.forEach((o, i) => { if (o === '*' || o === '/') V[V.length - 1] = ap(V[V.length - 1], o, vals[i + 1]); else { O.push(o); V.push(vals[i + 1]); } });
    return O.reduce((acc, o, i) => ap(acc, o, V[i + 1]), V[0]);
  }
  function splitArgs(s) { const out = []; let cur = '', q = null; for (const c of s) { if (q) { if (c === q) q = null; cur += c; } else if (c === '"' || c === "'") { q = c; cur += c; } else if (c === ',') { out.push(cur); cur = ''; } else cur += c; } if (cur.trim() || out.length) out.push(cur); return out; }
  function run(line) {
    const src = line.trim(), reads = new Set();
    try {
      if (!src) return { kind: 'none' };
      let m = src.match(/^print\s*\((.*)\)$/);
      if (m) { const parts = m[1].trim() ? splitArgs(m[1]).map(a => fmt(evalExpr(a, reads), true)) : []; return { kind: 'print', text: parts.join(' '), reads: [...reads] }; }
      m = src.match(/^([A-Za-z_]\w*)\s*\(/);
      if (m && m[1] !== 'print') throw ['NameError', `name '${m[1]}' is not defined`];
      m = src.match(/^([^=]+?)\s*=(?!=)\s*(.+)$/);
      if (m) {
        const name = m[1].trim();
        if (/\s/.test(name)) throw ['SyntaxError', 'invalid syntax', 'Variable names cannot contain spaces – try an underscore ( _ ).'];
        if (/^\d/.test(name)) throw ['SyntaxError', 'invalid decimal literal', 'Variable names cannot start with a number.'];
        if (!/^[A-Za-z_]\w*$/.test(name)) throw ['SyntaxError', 'invalid syntax', 'Use only letters, numbers and underscores in a variable name.'];
        if (KW.includes(name)) throw ['SyntaxError', `cannot assign to ${name}`, `${name} is a Python word – choose another name.`];
        const val = evalExpr(m[2], reads), old = vars[name];
        vars[name] = val;
        return { kind: 'set', name, val, old, reads: [...reads], shown: fmt(val) };
      }
      evalExpr(src, reads);
      return { kind: 'note', text: 'Tip: use print() to show a value in the Shell.' };
    } catch (e) {
      if (Array.isArray(e)) return { kind: 'error', text: `${e[0]}: ${e[1]}`, help: e[2] || '' };
      return { kind: 'error', text: 'SyntaxError: invalid syntax', help: '' };
    }
  }
  return { vars, run, fmt };
}

/* animate one line: type in editor → highlight boxes read → update memory / shell */
async function runLine(code, animate) {
  const ed = $('edCode'), ln = ed.children.length + 1, row = document.createElement('div');
  row.className = 'eln cur'; row.innerHTML = `<b>${ln}</b><span></span>`;
  ed.querySelectorAll('.cur').forEach(x => x.classList.remove('cur')); ed.appendChild(row); ed.scrollTop = ed.scrollHeight;
  const span = row.querySelector('span'), tok = simRun;
  if (animate) { for (let k = 1; k <= code.length; k++) { if (tok !== simRun) return null; span.innerHTML = hl(code.slice(0, k)); await new Promise(r => setTimeout(r, 26)); } await new Promise(r => setTimeout(r, 250)); }
  else span.innerHTML = hl(code);
  if (tok !== simRun || !row.isConnected) return null;
  const r = VM.run(code);
  if (r.reads) for (const n of r.reads) { const b = $('box-' + n); if (b) { b.classList.remove('read'); void b.offsetWidth; b.classList.add('read'); } }
  if (r.reads && r.reads.length && animate) await new Promise(res => setTimeout(res, 650));
  if (r.kind === 'set') { const b = setBox(r, animate); if (animate && b) { await fly(row, b.querySelector('.vval'), r.shown, 't-' + r.val.t); b.querySelector('.vval .in').style.visibility = ''; } }
  else if (r.kind === 'print') { if (animate) await Promise.all(r.reads.map(n => $('box-' + n) && fly($('box-' + n), $('shOut'), VM.fmt(VM.vars[n], true), 't-' + VM.vars[n].t))); shell(r.text, ''); }
  else if (r.kind === 'error') { row.classList.add('bad'); shell(r.text + (r.help ? `   👉 ${r.help}` : ''), 'err'); }
  else if (r.kind === 'note') shell(r.text, 'note');
  return r;
}
function hl(s) { return esc(s).replace(/(&quot;.*?(&quot;|$))/g, '<em class="s">$1</em>').replace(/\bprint\b/g, '<em class="f">print</em>').replace(/(^|[^\w])(\d+(\.\d+)?)(?![\w])/g, '$1<em class="n">$2</em>'); }
function shell(text, cls) { const d = document.createElement('div'); d.className = 'shl ' + cls; d.textContent = text; $('shOut').appendChild(d); $('shOut').scrollTop = $('shOut').scrollHeight; }
function fly(from, to, text, cls) {
  if (!from || !to) return Promise.resolve();
  const a = from.getBoundingClientRect(), b = to.getBoundingClientRect(), t = document.createElement('div');
  t.className = 'flyer ' + cls; t.textContent = text; document.body.appendChild(t);
  const x0 = a.left + Math.min(a.width / 2, 120) + scrollX, y0 = a.top + a.height / 2 + scrollY;
  t.style.left = x0 + 'px'; t.style.top = y0 + 'px';
  return new Promise(res => requestAnimationFrame(() => requestAnimationFrame(() => {
    t.style.transform = `translate(${b.left + b.width / 2 + scrollX - x0}px, ${b.top + b.height / 2 + scrollY - y0}px) scale(1.1)`;
    setTimeout(() => { t.remove(); res(); }, 750);
  })));
}
function setBox(r, animate) {

  if (!b) {
    b = document.createElement('div'); b.id = 'box-' + r.name; b.className = 'vbox t-' + r.val.t + ' drop';
    b.innerHTML = `<div class="vlab">${esc(r.name)}</div><div class="vval"><span class="in" ${animate ? 'style="visibility:hidden"' : ''}>${esc(r.shown)}</span></div><div class="vtype">${TYPE_TXT[r.val.t]}</div>`;

function vCheck() {
  const n = levelsDone() + (S.lv[3] ? 1 : 0);

function vHot() {
  $('app').innerHTML = `<div class="card">
    <span class="tag">HOT Question 🧠</span><h2>${esc(HOT_Q)}</h2>
    <p class="muted" style="font-size:15px">Explain in 1–2 sentences. Think about what Python does with words that are not in quotes.</p>

    <div class="err" id="err"></div><button class="btn" id="send">Submit my answer</button></div>`;
  $('hot').oninput = e => { S.hot = e.target.value; ls.set(STORE, S); };

function certSVG() {
  const gold = !!S.lv[3], W = 1400, H = 990;

  const logo = (document.querySelector('.top img') || {}).src || '';
  const name = S.name.trim(), nfs = name.length > 26 ? 58 : name.length > 18 ? 70 : 82;
  const lvl = gold ? 'GOLD · VARIABLE MASTER' : 'SILVER · VARIABLE EXPLORER';
  const medal = gold ? ['#FFE58A', '#F2B705', '#B8860B'] : ['#F4F6FA', '#C3CAD6', '#7D8797'];
  const RB = ['#FF5A5F', '#FF9F1C', '#FFD43B', '#3EC46D', '#2EC4B6', '#3D7AB8', '#7B5CD6', '#E056A0'];
  const star = (x, y, r, c) => { let p = ''; for (let k = 0; k < 10; k++) { const a = Math.PI / 5 * k - Math.PI / 2, rr = k % 2 ? r * .45 : r; p += `${(x + rr * Math.cos(a)).toFixed(1)},${(y + rr * Math.sin(a)).toFixed(1)} `; } return `<polygon points="${p}" fill="${c}"/>`; };
  // scalloped seal
  let seal = ''; const cx = 1150, cy = 760;
  for (let k = 0; k < 24; k++) { const a = k / 24 * Math.PI * 2; seal += `<circle cx="${(cx + 92 * Math.cos(a)).toFixed(1)}" cy="${(cy + 92 * Math.sin(a)).toFixed(1)}" r="16" fill="${medal[1]}"/>`; }
  // corner flourishes
  const corner = (x, y, sx, sy) => `<g transform="translate(${x} ${y}) scale(${sx} ${sy})">
      <path d="M0 0 L150 0 L150 14 L14 14 L14 150 L0 150 Z" fill="#1F2E6E"/>
      <path d="M28 28 L110 28 M28 28 L28 110" stroke="#C9A227" stroke-width="5" fill="none"/>
      <circle cx="28" cy="28" r="11" fill="#C9A227"/><circle cx="28" cy="28" r="5" fill="#fff"/>
      ${star(70, 62, 13, RB[(x + y) % 8])}${star(62, 70, 0, '#000')}</g>`;
  // colourful confetti strip at top and bottom
  let dots = '';
  for (let k = 0; k < 34; k++) { const x = 190 + k * 30.5; dots += `<rect x="${x}" y="${k % 2 ? 46 : 52}" width="16" height="7" rx="3" fill="${RB[k % 8]}" transform="rotate(${(k * 37) % 50 - 25} ${x + 8} 50)"/><rect x="${x}" y="${k % 2 ? 934 : 940}" width="16" height="7" rx="3" fill="${RB[(k + 3) % 8]}" transform="rotate(${(k * 53) % 50 - 25} ${x + 8} 940)"/>`; }
  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFDF5"/><stop offset=".55" stop-color="#FFF8E6"/><stop offset="1" stop-color="#F3F0FF"/></linearGradient>
    <linearGradient id="rb" x1="0" x2="1"><stop offset="0" stop-color="#FF5A5F"/><stop offset=".2" stop-color="#FF9F1C"/><stop offset=".4" stop-color="#FFD43B"/><stop offset=".6" stop-color="#3EC46D"/><stop offset=".8" stop-color="#3D7AB8"/><stop offset="1" stop-color="#7B5CD6"/></linearGradient>
    <linearGradient id="goldt" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#E9C46A"/><stop offset="1" stop-color="#B8860B"/></linearGradient>
    <radialGradient id="med" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="${medal[0]}"/><stop offset=".7" stop-color="${medal[1]}"/><stop offset="1" stop-color="${medal[2]}"/></radialGradient>
    <pattern id="wm" width="120" height="120" patternUnits="userSpaceOnUse"><text x="10" y="70" font-family="Consolas,monospace" font-size="22" fill="#7B5CD6" opacity=".05">x = 1</text></pattern>
  </defs>
  <rect width="${W}" height="${H}" fill="#1F2E6E"/>
  <rect x="18" y="18" width="${W - 36}" height="${H - 36}" rx="10" fill="url(#rb)"/>
  <rect x="30" y="30" width="${W - 60}" height="${H - 60}" rx="6" fill="url(#paper)"/>
  <rect x="30" y="30" width="${W - 60}" height="${H - 60}" fill="url(#wm)"/>
  <rect x="62" y="62" width="${W - 124}" height="${H - 124}" fill="none" stroke="#C9A227" stroke-width="3"/>
  <rect x="72" y="72" width="${W - 144}" height="${H - 144}" fill="none" stroke="#C9A227" stroke-width="1.2" stroke-dasharray="2 6"/>
  ${dots}
  ${corner(40, 40, 1, 1)}${corner(W - 40, 40, -1, 1)}${corner(40, H - 40, 1, -1)}${corner(W - 40, H - 40, -1, -1)}
  ${logo ? `<image href="${logo}" xlink:href="${logo}" x="${W / 2 - 48}" y="92" width="96" height="83"/>` : ''}
  <text x="${W / 2}" y="210" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="700" fill="#1F2E6E" letter-spacing="4">SHARJAH INDIAN SCHOOL, JUWAIZA</text>
  <text x="${W / 2}" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#66707F" letter-spacing="3">DEPARTMENT OF COMPUTER SCIENCE · WORK EDUCATION</text>
  <text x="${W / 2}" y="322" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="74" font-weight="700" fill="url(#goldt)" letter-spacing="6">CERTIFICATE</text>
  <text x="${W / 2}" y="364" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-style="italic" fill="#7B5CD6" letter-spacing="8">OF ACHIEVEMENT</text>
  <path d="M520 386 H880" stroke="#C9A227" stroke-width="2"/>${star(W / 2, 386, 10, '#C9A227')}
  <text x="${W / 2}" y="432" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#4A5568" letter-spacing="2">THIS CERTIFICATE IS PROUDLY PRESENTED TO</text>
  <text x="${W / 2}" y="${530}" text-anchor="middle" font-family="'Brush Script MT','Segoe Script','Lucida Handwriting',Georgia,serif" font-style="italic" font-size="${nfs}" fill="#1F2E6E">${esc(name)}</text>
  <path d="M330 552 H1070" stroke="#1F2E6E" stroke-width="1.5"/>
  <text x="${W / 2}" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#4A5568">Class ${CLASS_NAME} – Division ${esc(S.div)}</text>
  <text x="${W / 2}" y="638" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#2D3748">for successfully completing the <tspan font-weight="700" fill="#3D7AB8">Python Variables Lab</tspan> and showing that</text>
  <text x="${W / 2}" y="674" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#2D3748">they can <tspan font-weight="700" fill="#E04E6A">create and apply variables</tspan> to <tspan font-weight="700" fill="#3E8E41">store and print data</tspan> in Python.</text>
  <rect x="${W / 2 - 230}" y="700" width="460" height="54" rx="27" fill="${gold ? '#FFF3C4' : '#EEF1F6'}" stroke="${medal[2]}" stroke-width="2"/>
  <text x="${W / 2}" y="736" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="${medal[2]}" letter-spacing="2">${gold ? '★ ' : ''}${lvl}${gold ? ' ★' : ''}</text>
  <text x="${W / 2}" y="790" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#66707F">Starter ${starterScore()}/2  ·  Levels ${levelsDone()}/3${S.lv[3] ? ' + ★ Challenge' : ''}  ·  Plenary ${plenaryScore()}/2  ·  ${points()} points  ·  Success Criteria 3/3</text>
  <path d="M170 862 H470" stroke="#2D3748" stroke-width="1.5"/>
  <text x="320" y="850" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#2D3748">${d}</text>
  <text x="320" y="888" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#66707F" letter-spacing="2">DATE</text>
  <path d="M600 862 H900" stroke="#2D3748" stroke-width="1.5"/>
  <text x="750" y="850" text-anchor="middle" font-family="'Brush Script MT','Segoe Script','Lucida Handwriting',Georgia,serif" font-style="italic" font-size="34" fill="#1F2E6E">Bindhuja Bose B</text>
  <text x="750" y="888" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#66707F" letter-spacing="2">COMPUTER SCIENCE TEACHER</text>
  <path d="M${cx - 50} ${cy + 70} L${cx - 78} ${cy + 175} L${cx - 45} ${cy + 155} L${cx - 22} ${cy + 185} L${cx - 2} ${cy + 80} Z" fill="#E04E6A"/>
  <path d="M${cx + 50} ${cy + 70} L${cx + 78} ${cy + 175} L${cx + 45} ${cy + 155} L${cx + 22} ${cy + 185} L${cx + 2} ${cy + 80} Z" fill="#3D7AB8"/>
  ${seal}<circle cx="${cx}" cy="${cy}" r="92" fill="url(#med)"/>
  <circle cx="${cx}" cy="${cy}" r="74" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="4 5" opacity=".9"/>
  <text x="${cx}" y="${cy - 26}" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="800" fill="${medal[2]}" letter-spacing="3">PYTHON</text>
  <text x="${cx}" y="${cy + 14}" text-anchor="middle" font-family="Consolas,monospace" font-size="30" font-weight="700" fill="#1F2E6E">x = ✓</text>
  <text x="${cx}" y="${cy + 44}" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="800" fill="${medal[2]}" letter-spacing="3">${gold ? 'GOLD' : 'SILVER'}</text>
  ${star(250, 760, 16, RB[0])}${star(290, 730, 10, RB[2])}${star(215, 720, 9, RB[5])}
  </svg>`;
}
function vDone() {
  const gold = !!S.lv[3];
  $('app').innerHTML = `<div class="card center">
    <span class="tag">Certificate earned! 🏆</span><h1>Congratulations, ${esc(S.name.split(' ')[0])}!</h1>
    <p class="muted">You met all the success criteria – you can create variables to store data and print it!</p>
    <div class="certwrap" id="cert">${certSVG()}</div>
    <p style="font-weight:800;font-size:20px;margin:10px 0 0">${gold ? '🥇 Gold certificate – you completed all 4 levels!' : '🥈 Silver certificate – you completed Levels 1–3!'}</p>
    <div class="summary"><div><b>${starterScore()}/2</b><span>Starter</span></div><div><b>${levelsDone()}/3${S.lv[3] ? ' ★' : ''}</b><span>Levels</span></div><div><b>${plenaryScore()}/2</b><span>Plenary</span></div><div><b>${points()}</b><span>Points</span></div></div>
    <button class="btn" id="dl">⬇ Download certificate</button> <button class="btn ghost" id="pr">🖨️ Print</button>
    <p class="muted" style="margin-top:14px">Your teacher will now discuss the HOT question with the class.</p></div>`;
  confettiBurst();
  const toPng = cb => {
    const svg = certSVG(), img = new Image();
    img.onload = () => { const c = document.createElement('canvas'); c.width = 2100; c.height = 1485; c.getContext('2d').drawImage(img, 0, 0, 2100, 1485); try { cb(c.toDataURL('image/png')); } catch (e) { cb(null); } };
    img.onerror = () => cb(null);
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  };
  $('dl').onclick = () => toPng(url => { const a = document.createElement('a'); a.download = `Python_Certificate_${S.name.replace(/\W+/g, '_')}.png`;
    a.href = url || 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(certSVG()); if (!url) a.download = a.download.replace('.png', '.svg'); a.click(); });
  $('pr').onclick = () => {
    const w = window.open('', '_blank'); if (!w) return;
    w.document.write(`<!doctype html><title>Certificate – ${esc(S.name)}</title><style>@page{size:A4 landscape;margin:0}html,body{margin:0;height:100%}body{display:flex;align-items:center;justify-content:center}svg{width:100vw;height:auto;max-height:100vh}</style>${certSVG()}<script>onload=()=>setTimeout(()=>print(),300)<\/script>`);
    w.document.close();
  };
}
function confettiBurst() {
  const C = ['#FF5A5F', '#FF9F1C', '#FFD43B', '#3EC46D', '#2EC4B6', '#3D7AB8', '#7B5CD6', '#E056A0'];
  for (let i = 0; i < 70; i++) { const d = document.createElement('div'); d.className = 'cconf'; d.style.left = Math.random() * 100 + 'vw'; d.style.background = C[i % 8];
    d.style.animationDuration = (2 + Math.random() * 2) + 's'; d.style.animationDelay = Math.random() * .6 + 's'; document.body.appendChild(d); setTimeout(() => d.remove(), 5000); }
}

$('btnOut').onclick = () => {
  if (!confirm('Sign out? Your answers are already saved.')) return;
  ls.del(STORE); S = fresh(); confirmMode = false; $('sync').hidden = true; render();
};

if (MODE === 'teacher') { document.body.classList.add('teacher'); document.title = 'Teacher Dashboard – Python Variables'; document.querySelector('main').classList.add('dash'); $('btnOut').hidden = true; teacherLogin(); }
else { render(); if (S.stage !== 'login' && S.name) persist(); }
